<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ghost Candles</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b10;--mint:#7dffb8;--up:#2ee59d;--down:#ff4d6a;--gold:#ffc83d;--ink:#e8fff3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Unbounded',system-ui,sans-serif;color:var(--ink);
-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-start;padding:0 18px;pointer-events:none}
#sc{font-weight:800;font-size:44px;line-height:1;text-shadow:0 0 18px rgba(125,255,184,.7)}
#fx{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;justify-content:center;gap:8px;pointer-events:none}
.pill{font-weight:500;font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.4);border:1.5px solid}
.pill.sh{color:#5fd4ff;border-color:#5fd4ff}.pill.mg{color:#ff6b84;border-color:#ff6b84}
#cn{font-weight:500;font-size:15px;color:var(--gold);padding-top:8px}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(5,9,13,.55)}
#ov.hide{display:none}
h1{margin:0 0 10px;font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.05;color:var(--mint);text-shadow:0 0 24px rgba(125,255,184,.6)}
#ov p{margin:6px 0;font-weight:500;font-size:14px;line-height:1.5;max-width:300px;opacity:.85}
#big{font-weight:800;font-size:56px;margin:4px 0}
.btn{margin-top:20px;padding:14px 28px;border-radius:999px;border:2px solid var(--mint);color:var(--mint);font-weight:800;font-size:15px;box-shadow:0 0 22px rgba(125,255,184,.45) inset,0 0 22px rgba(125,255,184,.35)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div id="sc">0</div><div id="cn">0 монет</div></div>
<div id="fx"></div>
<div id="ov">
  <h1 id="ttl">Призрак<br>на графике</h1>
  <div id="big" style="display:none"></div>
  <p id="msg">Зажми экран — призрак взлетает, отпусти — снижается. Облетай свечи (часть из них двигается), собирай монеты. Щит и магнит работают по 5 секунд.</p>
  <div class="btn" id="btn">Нажми, чтобы лететь</div>
</div>

let W,H=640,S,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;S=innerHeight/H;W=innerWidth/S}
addEventListener('resize',resize);resize();
const TG=window.Telegram&&Telegram.WebApp;
try{if(TG){TG.ready();TG.expand();TG.disableVerticalSwipes&&TG.disableVerticalSwipes();TG.setBackgroundColor&&TG.setBackgroundColor('#1a1b1d');TG.setHeaderColor&&TG.setHeaderColor('#1a1b1d')}}catch(e){}
const hap=k=>{try{TG.HapticFeedback.impactOccurred(k)}catch(e){}};

const CW=52,R=19,GW=64,GH=GW*300/280;
let hapT=0,shT=0,mgT=0,pk=[],nsp=0,fxc='';
let st='ready',held=false,g,obs,coins,trail,parts,speed,score,coinN,passed,best=0,lastGy,t=0,deadAt=0,bg=[];
try{best=+localStorage.getItem('ghostBest')||0}catch(e){}
let pr=320,tr=0,vol=.5;
function nextC(x){
  const o=pr;tr=tr*.72+(Math.random()-.5)*30;if(Math.random()<.1)tr*=2.2;
  let c=o+tr;if(c<170){c=170;tr=Math.abs(tr)}if(c>470){c=470;tr=-Math.abs(tr)}
  pr=c;vol=Math.max(.15,Math.min(1,vol+(Math.random()-.5)*.35+Math.abs(c-o)/260*.1));
  return{x,o,c,h:Math.min(o,c)-Math.random()*20,l:Math.max(o,c)+Math.random()*20,v:vol};
}
let gscroll=0;
for(let x=-30;x<1600;x+=26)bg.push(nextC(x));

function reset(){
  g={x:Math.min(W*.3,150),y:H/2,vy:0};obs=[];coins=[];trail=[];parts=[];
  speed=2.7;hapT=0;shT=0;mgT=0;pk=[];nsp=0;score=0;coinN=0;passed=0;lastGy=H/2;
  let x=W+80;while(x<W+700){spawn(x);x+=235}
  hud();
}
function spawn(x){
  const gap=150+Math.random()*100,half=gap/2;
  const mv=++nsp>3&&Math.random()<.35;
  let gy=Math.max(half+25,Math.min(H-half-25,lastGy+(Math.random()-.5)*230));
  if(mv)gy=H/2+(Math.random()-.5)*60;
  const amp=mv?Math.min(80,gy-half-15,H-gy-half-15):0;
  const te=gy-half,bs=gy+half;
  obs.push({x,gy,gap,passed:false,dy:0,amp,ph:Math.random()*6.28,
    top:{end:te,len:Math.min(te,80+Math.random()*150),up:Math.random()>.5},
    bot:{start:bs,len:Math.min(H-bs,80+Math.random()*150),up:Math.random()>.5}});
  const pat=nsp%3,bonus=nsp%8===6?'sh':nsp%8===2?'mg':null;
  const x0=x-235+CW+28,st5=(235-CW-56)/4;
  for(let i=0;i<5;i++){
    const u=i/4,m=u*u*(3-2*u);
    let cy=lastGy+(gy-lastGy)*m;
    if(pat===1)cy+=Math.sin(u*Math.PI)*(nsp%2?-42:42);
    else if(pat===2)cy+=Math.sin(u*Math.PI*3)*26;
    cy=Math.max(40,Math.min(H-40,cy));
    if(bonus&&i===2)pk.push({x:x0+i*st5,y:cy,type:bonus,ph:0});
    else coins.push({x:x0+i*st5,y:cy,ph:i*.5});
  }
  lastGy=gy;
}
function hud(){$('sc').textContent=score;$('cn').textContent=coinN+' мон.'}
function start(){reset();st='play';$('ov').classList.add('hide')}
function die(){
  hap('heavy');
  st='dead';deadAt=performance.now();hapT=0;shT=0;mgT=0;fxc='';$('fx').innerHTML='';
  for(let i=0;i<30;i++)parts.push({x:g.x,y:g.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,l:1});
  const nb=score>best;if(nb){best=score;try{localStorage.setItem('ghostBest',best)}catch(e){}}
  setTimeout(()=>{
    $('ttl').innerHTML=nb?'Новый рекорд':'Ликвидация';
    $('big').style.display='block';$('big').textContent=score;
    $('msg').textContent='Монет: '+coinN+' · Рекорд: '+best;
    $('btn').textContent='Ещё раз';$('ov').classList.remove('hide');
  },450);
}

  held=true;
  if(st==='ready')start();
  else if(st==='dead'&&performance.now()-deadAt>900){$('ov').classList.add('hide');start()}
}
function rel(){held=false}
addEventListener('pointerdown',e=>{e.preventDefault();press()});
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!held)press()}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')rel()});
document.addEventListener('visibilitychange',()=>{held=false});

function hit(cx,cy,r,x,y,w,h){
  const nx=Math.max(x,Math.min(cx,x+w)),ny=Math.max(y,Math.min(cy,y+h));
  return (cx-nx)**2+(cy-ny)**2<r*r;
}
function update(k){
  if(st==='ready'){g.y=H/2+Math.sin(t/20)*10;g.vy=0;return}
  if(st==='play'){
    g.vy+=(held?-0.62:0.45)*k;g.vy=Math.max(-6.2,Math.min(6.8,g.vy));
    g.y+=g.vy*k;
    if(g.y<R){g.y=R;g.vy=0}
    if(g.y>H-R){if(shT>0){g.y=H-R;g.vy=0}else die()}
    hapT=Math.max(0,hapT-k/60);shT=Math.max(0,shT-k/60);mgT=Math.max(0,mgT-k/60);
    speed=Math.min(5.2,2.7+passed*0.045);
  }
  const sp=st==='play'?speed:speed*.4;
  for(const o of obs){o.x-=sp*k;if(o.amp){o.ph+=.035*k;o.dy=o.amp*Math.sin(o.ph)}}
  for(const p of pk)p.x-=sp*k;
  for(const c of coins)c.x-=sp*k;
  for(const p of trail)p.x-=sp*k*.7;
  for(const b of bg)b.x-=sp*k*.2;gscroll+=sp*k*.2;
  if(st==='play'){
    if(Math.random()<.45)trail.push({x:g.x-8,y:g.y+8+(Math.random()-.5)*14,r:14+Math.random()*10,l:1,vy:(Math.random()-.5)*.25});
    for(const o of obs){
      if(shT<=0&&(hit(g.x,g.y+2,R,o.x,o.top.end-o.top.len+o.dy,CW,o.top.len)||hit(g.x,g.y+2,R,o.x,o.bot.start+o.dy,CW,o.bot.len))){die();break}
      if(!o.passed&&o.x+CW<g.x){o.passed=true;passed++;score++;hud()}
    }
    for(let i=pk.length-1;i>=0;i--){
      const p=pk[i];
      if((p.x-g.x)**2+(p.y-g.y)**2<(R+18)**2){
        hapT=.8;if(p.type==='sh')shT=5;else mgT=5;
        pk.splice(i,1);
        for(let j=0;j<14;j++)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:1,gold:0});
      }
    }
    let f='';if(shT>0)f+='<span class="pill sh">🛡 '+shT.toFixed(1)+'</span>';if(mgT>0)f+='<span class="pill mg">🧲 '+mgT.toFixed(1)+'</span>';
    if(f!==fxc){fxc=f;$('fx').innerHTML=f}
    for(let i=coins.length-1;i>=0;i--){
      const c=coins[i];
      if(mgT>0){const dx=g.x-c.x,dy=g.y-c.y,d=Math.hypot(dx,dy);if(d<190&&d>1){c.x+=dx/d*7*k;c.y+=dy/d*7*k}}
      if((c.x-g.x)**2+(c.y-g.y)**2<(R+12)**2){
        hap('light');hapT=.35;coins.splice(i,1);coinN++;score+=3;hud();
        for(let j=0;j<10;j++)parts.push({x:c.x,y:c.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:1,gold:1});
      }
    }
  }
  for(const h of trail){h.l-=.011*k;h.r+=.22*k;h.y+=h.vy*k}
  trail=trail.filter(h=>h.l>0);
  while(obs.length&&obs[0].x<-CW-20)obs.shift();
  while(coins.length&&coins[0].x<-30)coins.shift();
  pk=pk.filter(p=>p.x>-30);
  const last=obs[obs.length-1];if(last&&last.x<W+260)spawn(last.x+235);
  for(const p of parts){p.x+=p.vx*k;p.y+=p.vy*k;p.l-=.03*k}
  parts=parts.filter(p=>p.l>0);
  while(bg.length>2&&bg[0].x<-30)bg.shift();
  while(bg[bg.length-1].x<W+40)bg.push(nextC(bg[bg.length-1].x+26));
}
function candle(x,y,len,up,wickFrom,wickTo,dir){
  const col=up?'#2ee59d':'#ff4d6a';
  ctx.shadowColor=col;ctx.shadowBlur=14;
  ctx.fillStyle=col;ctx.fillRect(x+CW/2-2,wickFrom,4,wickTo-wickFrom);
  ctx.fillRect(x,y,CW,len);
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(x+5,y,7,len);
}
function draw(){
  ctx.setTransform(dpr*S,0,0,dpr*S,0,0);
  const bgG=ctx.createLinearGradient(0,0,0,H);bgG.addColorStop(0,'#1a1b1d');bgG.addColorStop(1,'#1d1f1f');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.setLineDash([5,6]);
  for(let y=72;y<H;y+=72){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(let x=108-(gscroll%108);x<W;x+=108){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  ctx.setLineDash([]);
  for(const b of bg){ctx.fillStyle='rgba(255,255,255,.07)';const vh=12+b.v*70;ctx.fillRect(b.x-8,H-vh,16,vh)}
  for(const b of bg){
    const up=b.c<b.o;ctx.fillStyle=up?'rgba(90,176,192,.6)':'rgba(232,104,92,.6)';
    ctx.fillRect(b.x-1,b.h,2,b.l-b.h);
    const top=Math.min(b.o,b.c);ctx.fillRect(b.x-7,top,14,Math.max(4,Math.abs(b.c-b.o)));
  }
  // obstacles
  for(const o of obs){
    const t0=o.top.end-o.top.len;
    candle(o.x,t0+o.dy,o.top.len,o.top.up,0,t0+o.dy+6);
    candle(o.x,o.bot.start+o.dy,o.bot.len,o.bot.up,o.bot.start+o.dy+o.bot.len-6,H);
    if(o.amp){ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1.5;ctx.strokeRect(o.x,t0+o.dy,CW,o.top.len);ctx.strokeRect(o.x,o.bot.start+o.dy,CW,o.bot.len)}
  }
  for(const p of pk){
    const y=p.y+Math.sin(t/16+p.ph)*4,c=p.type==='sh'?'#5fd4ff':'#ff6b84';
    ctx.save();ctx.translate(p.x,y);
    ctx.shadowColor=c;ctx.shadowBlur=16;ctx.fillStyle='rgba(10,14,18,.8)';ctx.strokeStyle=c;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,16,0,6.283);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    if(p.type==='sh'){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(8,-5);ctx.quadraticCurveTo(8,4,0,10);ctx.quadraticCurveTo(-8,4,-8,-5);ctx.closePath();ctx.fill()}
    else{ctx.strokeStyle=c;ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(-6,-7);ctx.lineTo(-6,0);ctx.arc(0,0,6,Math.PI,0,true);ctx.lineTo(6,-7);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(-8.3,-9,4.6,4);ctx.fillRect(3.7,-9,4.6,4)}
    ctx.restore();
  }
  // coins
  for(const c of coins){
    const sx=Math.abs(Math.cos(t/14+c.ph))*.8+.2;
    ctx.save();ctx.translate(c.x,c.y);ctx.scale(sx,1);
    ctx.shadowColor='#ffc83d';ctx.shadowBlur=14;ctx.fillStyle='#ffc83d';
    ctx.beginPath();ctx.arc(0,0,11,0,6.283);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='#b57a00';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#8a5a00';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('₿',0,1);
    ctx.restore();
  }
  // trail
  ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(const h of trail){
    const gr=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,h.r);
    gr.addColorStop(0,`rgba(150,255,200,${h.l*.16})`);gr.addColorStop(1,'rgba(150,255,200,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,6.283);ctx.fill();
  }
  for(const p of parts){
    ctx.fillStyle=p.gold?`rgba(255,200,61,${p.l})`:`rgba(125,255,184,${p.l*.8})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.gold?3:2.2*p.l+.6,0,6.283);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  if(st==='play'&&mgT>0&&(mgT>1.2||Math.floor(t/6)%2)){
    for(let i=0;i<2;i++){const ph=(t/50+i*.5)%1;ctx.strokeStyle=`rgba(255,107,132,${.4*ph})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(g.x,g.y,190*(1-ph)+20,0,6.283);ctx.stroke()}
  }
  drawGhost();
  if(st==='play'&&shT>0&&(shT>1.2||Math.floor(t/6)%2)){
    const gr=ctx.createRadialGradient(g.x,g.y,20,g.x,g.y,44);gr.addColorStop(0,'rgba(95,212,255,.05)');gr.addColorStop(1,'rgba(95,212,255,.28)');
    ctx.fillStyle=gr;ctx.strokeStyle='rgba(140,230,255,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(g.x,g.y+2,44,0,6.283);ctx.fill();ctx.stroke();
  }
}

const SW=280,SH=300,EY=[{x:177,y:43,w:40,h:26},{x:235,y:42,w:38,h:25}],MO={x:143,y:99,w:132,h:38};
const F={sc:1,gx:0,gy:0,sm:0,msx:1,msy:1,op:1,wob:0};
let blinkAt=90,blinkS=-99,mood='idle';
const MOODS={idle:{sc:1,sm:0,msx:1,msy:1,op:1,wob:0},rise:{sc:1.05,sm:8,msx:1,msy:1,op:1,wob:0},fall:{sc:1.22,sm:-6,msx:.85,msy:1.6,op:1,wob:0},scared:{sc:1.3,sm:-5,msx:.8,msy:1.9,op:1,wob:1},cool:{sc:1,sm:9,msx:1.02,msy:1,op:.82,wob:0},happy:{sc:1.12,sm:18,msx:1.04,msy:1.1,op:1,wob:0},dead:{sc:1,sm:-14,msx:.9,msy:1.3,op:1,wob:0}};
function pickMood(){
  if(st==='dead')return'dead';
  if(hapT>0)return'happy';
  if(st==='play'){
    if(shT<=0)for(const o of obs){const a=o.x-g.x;if(a>-CW&&a<110){const cl=Math.min(g.y-(o.top.end+o.dy),(o.bot.start+o.dy)-g.y);if(cl<42)return'scared'}}
    if(shT>0||mgT>0)return'cool';
    if(g.vy>2.8)return'fall';
    if(held)return'rise';
  }
  return'idle';
}
function drawGhost(){
  if(!IM.base.complete||(st==='dead'&&performance.now()-deadAt>450))return;
  const T=t;mood=pickMood();const M=MOODS[mood];
  let tx=0,ty=0,bd=1e9,bx=0,by=0;
  const look=l=>{for(const c of l){const dx=c.x-g.x;if(dx>-10&&dx<380){const d=dx*dx+(c.y-g.y)**2;if(d<bd){bd=d;bx=c.x;by=c.y}}}};
  if(mood==='scared'){for(const o of obs){if(o.x-g.x>-CW&&o.x-g.x<110){bx=o.x;by=o.gy+o.dy;bd=0;break}}}
  else{look(coins);look(pk)}
  if(bd>=1e9)for(const o of obs){if(o.x+CW>g.x){bx=o.x;by=o.gy+o.dy;bd=1;break}}
  if(bd<1e9){tx=Math.max(-1,Math.min(1,(bx-g.x)/90));ty=Math.max(-1,Math.min(1,(by-g.y)/90))}
  if(mood==='rise')ty=Math.min(ty,-.5);if(mood==='fall')ty=Math.max(ty,.5);
  for(const key of ['sc','sm','msx','msy','op','wob'])F[key]+=(M[key]-F[key])*.18;
  F.gx+=(tx-F.gx)*.2;F.gy+=(ty-F.gy)*.2;
  if(T>blinkAt){blinkS=T;blinkAt=T+150+Math.random()*270;if(Math.random()<.25)blinkAt=T+18}
  const bp=(T-blinkS)/11,blink=bp>=0&&bp<=1?Math.sin(bp*Math.PI):0;
  const hl=ctx.createRadialGradient(g.x,g.y,4,g.x,g.y,62);hl.addColorStop(0,'rgba(125,255,184,.2)');hl.addColorStop(1,'rgba(125,255,184,0)');
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=hl;ctx.beginPath();ctx.arc(g.x,g.y,62,0,6.283);ctx.fill();ctx.globalCompositeOperation='source-over';
  ctx.save();ctx.translate(g.x,g.y);ctx.rotate(Math.max(-.4,Math.min(.5,g.vy*.06)));
  ctx.translate(-GW*.5,-GH*.45);ctx.scale(GW/SW,GW/SW);
  // body + wind-blown tail
  const yT=138,spd=st==='play'?speed:1.5,amp=16+(held&&st==='play'?8:0),lean=14+spd*5;
  ctx.drawImage(IM.base,0,0,SW,yT,0,0,SW,yT);
  for(let sy=yT;sy<SH;sy+=3){
    const f=(sy-yT)/(SH-yT),f2=Math.pow(f,1.4),h=Math.min(3,SH-sy);
    const xo=-lean*f2+Math.sin(T*.13-f*5)*amp*f2,yo=-g.vy*5*f2+Math.sin(T*.09-f*3)*3*f2;
    ctx.drawImage(IM.base,0,sy,SW,h,xo,sy+yo,SW,h+.8);
  }
  // eyes
  const ca=Math.max(blink,1-F.op);ctx.lineCap='round';ctx.strokeStyle='#101418';
  for(let i=0;i<2;i++){
    const E=EY[i],cx=E.x+E.w/2,cy=E.y+E.h/2,pim=i?IM.p1:IM.p0;
    if(mood==='dead'){ctx.lineWidth=3.4;ctx.beginPath();ctx.moveTo(cx-8,cy-8);ctx.lineTo(cx+8,cy+8);ctx.moveTo(cx+8,cy-8);ctx.lineTo(cx-8,cy+8);ctx.stroke()}
    else{
      const lidY=Math.max(E.y-1,cy-E.h/2+ca*E.h*1.1);
      if(ca<.97){ctx.save();ctx.beginPath();ctx.rect(E.x-8,lidY,E.w+16,E.h+16);ctx.clip();ctx.translate(cx+F.gx*11,cy+(F.gy>0?F.gy*9:F.gy*3));ctx.scale(F.sc,F.sc);ctx.drawImage(pim,-E.w/2,-E.h/2,E.w,E.h);ctx.restore()}
      if(ca>.08){ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(E.x-1,lidY+2);ctx.quadraticCurveTo(cx,lidY+(ca>.9?5:2),E.x+E.w+1,lidY+2);ctx.stroke()}
    }
  }
  // mouth
  const mx=MO.x+MO.w/2,my=MO.y+MO.h/2;
  for(let sx=0;sx<MO.w;sx+=2){
    const xn=(sx+1)/MO.w*2-1,yo=F.sm*(1-xn*xn)+F.wob*Math.sin(T*.5+xn*7)*2.2,w2=Math.min(2,MO.w-sx);
    ctx.drawImage(IM.mouth,sx,0,w2,MO.h,mx+(sx-MO.w/2)*F.msx,my+yo-MO.h/2*F.msy,w2*F.msx+.7,MO.h*F.msy);
  }
  if(mood==='scared'){const y=24+(T*1.4)%34;ctx.fillStyle='rgba(143,227,255,.9)';ctx.beginPath();ctx.moveTo(252,y-10);ctx.quadraticCurveTo(260,y+2,252,y+7);ctx.quadraticCurveTo(244,y+2,252,y-10);ctx.fill()}
  ctx.restore();
}
let prev=performance.now();
function loop(now){
  const dt=Math.min(50,now-prev);prev=now;const k=dt/16.667;t+=k;
  update(k);draw();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
